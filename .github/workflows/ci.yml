name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service-tests:
    name: Service · security and isolation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm test

  dashboard-build:
    name: Dashboard · build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next build
        env:
          AUTH_SECRET: ci-only-secret-not-used-anywhere
          WA_API_TOKEN: ci

  website-build:
    name: Website · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: service
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: false
